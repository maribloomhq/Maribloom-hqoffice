<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Quest · Chai</title>
<meta name="theme-color" content="#5fa8e8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232a9d8f'/%3E%3Cpath d='M32 12l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z' fill='%23ffd23f'/%3E%3C/svg%3E">
<style>
:root{--ink:#1f2b36;--panel:rgba(255,253,247,.94);--line:#e7dccb;--teal:#2a9d8f;--sun:#e9c46a;--coral:#e76f51}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#bfe2ff;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#stage canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.logo{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;border:3px solid var(--sun);font:800 14px/1.15 system-ui;letter-spacing:.06em}.logo small{display:block;color:var(--sun);font-weight:700;letter-spacing:.02em}
.btn{font:700 14px system-ui,sans-serif;color:#fff;background:var(--teal);border:0;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn.small{min-height:38px;padding:7px 12px;font-size:13px}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 8px max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:5}
.dock .btn{background:var(--ink)}.dock .btn.p{background:var(--coral)}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;font:700 12px system-ui;background:var(--ink);color:#fff;border:2px solid #7cbf6a;padding:2px 9px;border-radius:999px;white-space:nowrap}
.side{position:fixed;top:82px;width:270px;display:flex;flex-direction:column;gap:10px;z-index:4;max-height:calc(100vh - 160px);overflow:auto}
#left{left:14px}#right{right:14px}
.hud{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 rgba(31,43,54,.25)}
.hud h3,#card h4{font:800 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
.stat{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}.stat.xp{font-weight:800}
.bar{height:10px;border-radius:6px;background:#efe6d6;overflow:hidden;border:1.5px solid var(--ink)}.bar i{display:block;height:100%}
.quest{font-weight:700;margin-bottom:8px}.quest.done{text-decoration:line-through;color:#6b7785}
.row{display:flex;gap:6px;flex-wrap:wrap}
.checks{list-style:none;padding:0}.checks button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:5px 0;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.checks .box{flex:none;width:20px;height:20px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-weight:900;color:#fff;background:#fff}
.checks [aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.chip{font:700 12.5px system-ui;border:2px solid var(--line);background:#f4efe6;color:#6b7785;border-radius:999px;padding:5px 10px;cursor:pointer;min-height:32px}
.chip.on{background:#fff3cf;border-color:var(--sun);color:var(--ink)}
.muted{color:#6b7785;font-size:12.5px}
#card{position:fixed;z-index:6;left:10px;right:10px;bottom:max(70px,calc(env(safe-area-inset-bottom) + 70px));max-width:420px;margin:0 auto;background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:14px 16px 16px;max-height:62vh;overflow:auto;box-shadow:0 6px 0 rgba(31,43,54,.25)}
#card[hidden]{display:none}#card h2{font:900 19px system-ui;margin-bottom:6px;padding-right:36px}#card p{margin-bottom:8px}#card h4{margin-top:6px}
#cardClose{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:20px;cursor:pointer}
.portrait{display:block;width:100px;height:100px;border-radius:50%;margin:0 auto 10px}
#cheer{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:8;background:var(--ink);color:var(--sun);font:900 22px system-ui;padding:12px 20px;border-radius:14px;border:3px solid var(--sun);pointer-events:none}
#cheer.show{animation:pop 1.6s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#bfe2ff;font:800 16px system-ui;z-index:9}
.phone-only{display:inline-flex}
@media (max-width:899px){.side{display:none}.phone-only{display:inline-flex}.dock .btn{padding:7px 10px;font-size:12.5px;min-height:40px}}
@media (min-width:900px){#card{left:auto;right:300px;bottom:84px;margin:0;width:380px}}
@media (prefers-reduced-motion:reduce){#cheer.show{animation:none}}
</style>
</head>
<body>
<div id="loading">Opening Career Quest…</div>
<div id="stage"></div>
<div id="tags" aria-hidden="true"></div>
<header class="top"><div class="logo">CAREER QUEST<small>Chai · growing every day</small></div></header>
<aside class="side" id="left" aria-label="Quest and stats"></aside>
<aside class="side" id="right" aria-label="Achievements and skills"></aside>
<nav class="dock" aria-label="Go to">
  <button class="btn" data-go="home">Building</button>
  <button class="btn" data-go="2">Top</button>
  <button class="btn" data-go="1">Middle</button>
  <button class="btn" data-go="0">Ground</button>
  <button class="btn" data-go="roof">Roof</button>
  <button class="btn p phone-only" data-act="panel" data-k="quest">Quest</button>
  <button class="btn p phone-only" data-act="panel" data-k="stats">Stats</button>
  <button class="btn p phone-only" data-act="panel" data-k="ach">Trophies</button>
  <button class="btn p phone-only" data-act="panel" data-k="skills">Skills</button>
</nav>
<section id="card" hidden role="dialog" aria-labelledby="cardTitle"><button id="cardClose" aria-label="Close">×</button><h2 id="cardTitle"></h2><div id="cardBody"></div></section>
<div id="cheer" role="status" aria-live="polite"></div>
