<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maribloom · Head Office</title>
<meta name="theme-color" content="#2a2d33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236B3FE0'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23E2BE63'/%3E%3C/svg%3E">
<style>
:root{--brand:#6B3FE0;--gold:#e2be63;--panel:rgba(30,20,52,.86);--ink:#f4efff;--muted:#c3b7e6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#2a2d33;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#stage canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:fixed;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid rgba(226,190,99,.35);border-radius:999px;padding:7px 14px 7px 8px;backdrop-filter:blur(8px)}
.brand i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0 30%,var(--brand) 32%);display:block}
.brand b{display:block;font:700 14px/1.1 Georgia,serif;letter-spacing:.08em}.brand small{color:var(--muted);font-size:12px}
.btn{font:600 14px system-ui,sans-serif;color:#fff;background:var(--brand);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost,.dock .btn{background:var(--panel);backdrop-filter:blur(8px)}
.btn[aria-pressed="true"]{background:var(--brand);border-color:var(--gold)}
.btn:focus-visible,#cardClose:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;font:600 12px system-ui,sans-serif;background:rgba(30,20,52,.78);color:#fff;border:1px solid rgba(226,190,99,.45);padding:3px 9px;border-radius:999px;white-space:nowrap;will-change:transform}
#card{position:fixed;z-index:6;left:12px;right:12px;bottom:max(72px,calc(env(safe-area-inset-bottom) + 72px));max-width:420px;margin:0 auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(226,190,99,.4);border-radius:18px;padding:16px 18px 18px;max-height:60vh;overflow:auto}
#card[hidden]{display:none}
#card h2{font:700 20px Georgia,serif;color:#f7e7b8;margin-bottom:8px;padding-right:36px}
#cardClose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer}
#cardBody p{margin-bottom:8px}.muted{color:var(--muted);font-size:13.5px}
#cardBody .portrait{display:block;width:104px;height:104px;border-radius:50%;margin:2px auto 12px}
.list{list-style:none;padding:0;margin:0 0 10px}.list li{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,.08)}
.list i{width:10px;height:10px;border-radius:50%;flex:none}
#cardActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#2a2d33;color:var(--muted);font:600 15px system-ui;z-index:9}
.hint{position:fixed;left:50%;top:76px;transform:translateX(-50%);font-size:12.5px;color:var(--muted);background:var(--panel);padding:5px 12px;border-radius:999px;z-index:4;white-space:nowrap;transition:opacity .6s}
@media (min-width:900px){#card{left:auto;right:20px;bottom:92px;margin:0;width:380px}}
@media (max-width:520px){.dock{gap:6px;flex-wrap:nowrap}.dock .btn{padding:7px 10px;font-size:12.5px;min-height:40px;flex:none}.dock{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.dock::-webkit-scrollbar{display:none}#card{bottom:max(66px,calc(env(safe-area-inset-bottom) + 66px))}}
@media (prefers-reduced-motion:reduce){.tag{transition:none}}
</style>
</head>
<body>
<div id="loading">Opening your Head Office…</div>
<div id="stage"></div>
<div id="tags" aria-hidden="true"></div>
<header class="bar">
  <div class="brand"><i aria-hidden="true"></i><div><b>MARIBLOOM</b><small>Head Office</small></div></div>
  <button class="btn ghost" id="spin" aria-pressed="false" title="Slowly turn the view">Auto spin</button>
</header>
<p class="hint" id="hint">Drag to look around · tap anything</p>
<nav class="dock" aria-label="Go to">
  <button class="btn" data-go="brain">Brain</button>
  <button class="btn" data-go="desk">My desk</button>
  <button class="btn" data-go="desks">Team</button>
  <button class="btn" data-go="screens">Screens</button>
  <button class="btn" data-go="pantry">Pantry</button>
  <button class="btn" data-go="wc">WC</button>
  <button class="btn" data-go="room">Room</button>
</nav>
<section id="card" hidden role="dialog" aria-labelledby="cardTitle">
  <button id="cardClose" aria-label="Close">×</button>
  <h2 id="cardTitle"></h2>
  <div id="cardBody"></div>
  <div id="cardActions" hidden></div>
</section>
